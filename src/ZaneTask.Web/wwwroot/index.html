<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ZaneTask</title>
    <base href="/" />
    <script>
        // Apply the saved theme before anything is drawn; js/app.js keeps it up to date afterwards.
        (function () {
            var pref = "system";
            try { pref = localStorage.getItem("zanetask.theme") || "system"; } catch (e) { }
            var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div class="page-loading" role="status">
            <span class="spinner" aria-hidden="true"></span> Loading ZaneTask…
        </div>
    </div>

    <div id="blazor-error-ui" role="alert">
        Something went wrong. <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">×</button>
    </div>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
